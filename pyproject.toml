[tool.poetry]
name = "hyperspectral-rww"
version = "0.1.0"
description = "Модульный конвейер обработки гиперспектральных данных RWW"
authors = ["Research Project"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
numpy = ">=1.26,<3.0"
pillow = ">=10.0,<12.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[tool.poetry.scripts]
hyperspectral = "main:main"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
